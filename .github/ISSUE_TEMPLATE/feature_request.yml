name: 功能请求 / Feature request
title: '[Feature] '
description: 提出你的功能请求 / Propose your feature request
labels: ['enhancement']
type: 'Feature'

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交问题之前，请确认以下事项：
        1. 请 **确保** 您已经查阅了上游 [Clash Verge Rev 官方文档](https://clash-verge-rev.github.io/guide/term.html)，确认软件不存在类似功能
        2. 请 **确保** [MEOW 已有的问题](https://github.com/Shiro-Design-16/MEOW/issues?q=is%3Aissue) 中没有人提交过相似 issue，否则请在已有的 issue 下进行讨论
        3. 请 **务必** 给issue填写一个简洁明了的标题，以便他人快速检索
        4. 请说明该功能为何适合 MEOW，以及它与上游同步可能产生的维护影响
        5. 请 **务必** 按照模板规范详细描述请求，否则 issue 可能会被关闭
        ## Before submitting the issue, please make sure of the following checklist:
        1. Please make sure you have read the upstream [Clash Verge Rev documentation](https://clash-verge-rev.github.io/guide/term.html) to confirm that the software does not already provide similar functionality
        2. Please make sure there is no similar issue in the [existing MEOW issues](https://github.com/Shiro-Design-16/MEOW/issues?q=is%3Aissue); otherwise, discuss it under the existing issue
        3. Please be sure to fill in a concise and clear title for the issue so that others can quickly search
        4. Explain why the feature belongs in MEOW and any maintenance impact it may have when syncing with upstream
        5. Please describe the request in detail according to the template; otherwise, the issue may be closed

  - type: textarea
    id: description
    attributes:
      label: 功能描述 / Feature description
      description: 详细清晰地描述你的功能请求 / A clear and concise description of what the feature is
    validations:
      required: true
  - type: textarea
    attributes:
      label: 使用场景 / Use case
      description: 请描述你的功能请求的使用场景 / Please describe the use case of your feature request
    validations:
      required: true
  - type: checkboxes
    id: os-labels
    attributes:
      label: 适用系统 / Target OS
      description: 请选择该功能适用的操作系统（至少选择一个） / Please select the operating system(s) for this feature request (select at least one)
      options:
        - label: windows
        - label: macos
        - label: linux
    validations:
      required: true
