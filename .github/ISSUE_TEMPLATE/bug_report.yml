name: 问题反馈 / Bug report
title: '[BUG] '
description: 反馈你遇到的问题 / Report the issue you are experiencing
labels: ['bug']
type: 'Bug'

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交问题之前，请确认以下事项：

        1. 请 **确保** 您已经查阅了上游 [Clash Verge Rev 官方文档](https://clash-verge-rev.github.io/guide/term.html) 以及 [常见问题](https://clash-verge-rev.github.io/faq/windows.html)
        2. 请 **确保** [MEOW 已有的问题](https://github.com/Shiro-Design-16/MEOW/issues?q=is%3Aissue) 中没有人提交过相似 issue，否则请在已有的 issue 下进行讨论
        3. 请 **务必** 给 issue 填写一个简洁明了的标题，以便他人快速检索
        4. 请确认问题能够在 MEOW 中复现，并注明所用版本或提交编号
        5. 请勿将仅在 MEOW 中出现的问题提交给上游维护者

        ## Before submitting the issue, please make sure of the following checklist:

        1. Please make sure you have read the upstream [Clash Verge Rev documentation](https://clash-verge-rev.github.io/guide/term.html) and [FAQ](https://clash-verge-rev.github.io/faq/windows.html)
        2. Please make sure there is no similar issue in the [existing MEOW issues](https://github.com/Shiro-Design-16/MEOW/issues?q=is%3Aissue); otherwise, discuss it under the existing issue
        3. Please be sure to fill in a concise and clear title for the issue so that others can quickly search
        4. Confirm that the issue is reproducible in MEOW and include the version or commit used
        5. Do not report issues that occur only in MEOW to upstream maintainers

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Describe the bug
      description: 详细清晰地描述你遇到的问题，并配合截图 / Describe the problem you encountered in detail and clearly, and provide screenshots
    validations:
      required: true
  - type: textarea
    attributes:
      label: 软件版本 / MEOW Version
      description: 请提供 MEOW 的具体版本或提交编号 / Please provide the specific MEOW version or commit hash
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤 / To Reproduce
      description: 请提供复现问题的步骤 / Steps to reproduce the behavior
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 操作系统 / OS
      options:
        - label: Windows
        - label: Linux
        - label: MacOS
    validations:
      required: true
  - type: input
    attributes:
      label: 操作系统版本 / OS Version
      description: 请提供你的操作系统版本，Linux请额外提供桌面环境及窗口系统 / Please provide your OS version, for Linux, please also provide the desktop environment and window system
    validations:
      required: true
  - type: textarea
    attributes:
      label: 日志(勿上传日志文件，请粘贴日志内容) / Log (Do not upload the log file, paste the log content directly)
      description: 请提供完整或相关部分的Debug日志（请在“软件左侧菜单”->“设置”->“日志等级”调整到debug，Verge错误请把“杂项设置”->“app日志等级”调整到debug，并重启Verge生效。日志文件在“软件左侧菜单”->“设置”->“日志目录”下） / Please provide a complete or relevant part of the Debug log (please adjust the "Log level" to debug in "Software left menu" -> "Settings" -> "Log level". If there is a Verge error, please adjust "Miscellaneous settings" -> "app log level" to debug, and restart Verge to take effect. The log file is under "Software left menu" -> "Settings" -> "Log directory")
      placeholder: |
        日志目录一般位于 MEOW 安装目录的 "logs/" 子目录中，请将日志内容粘贴到此处。
        The log directory is usually located in the "logs/" subdirectory of the MEOW installation directory. Please paste the log content here.
      render: log
    validations:
      required: true
