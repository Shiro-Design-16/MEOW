name: MEOW Source Release

on:
  push:
    tags:
      - 'MEOW-*.*.*'

permissions:
  contents: write

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Publish source release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' package.json)
          EXPECTED_TAG="MEOW-${VERSION}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${EXPECTED_TAG}."
            exit 1
          fi

          if ! git branch -r --contains "${GITHUB_SHA}" | grep -q 'origin/dev'; then
            echo "Release tags must point to a commit on the dev branch."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: 'MEOW ${{ env.VERSION }}'
          body: |
            MEOW 的第一个公开版本。

            此版本建立 MEOW 自己的版本体系和项目声明，功能基线继承自 Clash Verge Rev v2.5.2。当前仅包含品牌与仓库层面的初始化调整，没有引入独立功能变更。

            本次为源码 Release。Windows、macOS 和 Linux 安装包将在 MEOW 完成独立应用标识、更新签名和构建流程后提供。

            ---

            This is the first public MEOW release. It establishes MEOW's own versioning and project identity while retaining the Clash Verge Rev v2.5.2 functional baseline. No independent application behavior changes are included.

            This is a source-only release. Installers will be provided after MEOW has its own application identity, update signing keys, and verified build pipeline.
          generate_release_notes: true
          draft: false
          prerelease: false
