name: MEOW Source Release

on:
  push:
    tags:
      - 'MEOW-*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing MEOW source release tag'
        required: true
        default: 'MEOW-0.0.2'

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag, version, and build instructions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          EXPECTED_TAG="MEOW-${VERSION}"

          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${EXPECTED_TAG}."
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse HEAD)
          if ! git branch -r --contains "${TAG_COMMIT}" | grep -q 'origin/dev'; then
            echo 'Release tags must point to a commit on the dev branch.'
            exit 1
          fi

          test -f BUILDING.md
          test -f scripts/build-installer.mjs
          node -e "const p=require('./package.json'); if (!p.scripts['build:installer']) process.exit(1)"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  release:
    name: Publish MEOW ${{ needs.validate.outputs.version }} source
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Publish source-only GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: 'MEOW ${{ needs.validate.outputs.version }}'
          tag_name: ${{ needs.validate.outputs.tag }}
          body: |
            MEOW 0.0.2 暂时仅以源代码形式发布，不提供官方预编译二进制文件。

            GitHub 会自动提供 `Source code (zip)` 与 `Source code (tar.gz)`。下载源码后，请按照仓库中的 `BUILDING.md` 构建：

            - macOS：生成 DMG，构建完成后自动打开，由用户决定是否安装
            - Windows：生成 NSIS 安装包，构建完成后打开安装向导，由用户决定继续或取消
            - 本地生成的安装包没有 MEOW 官方签名，请只构建和运行可信提交

            0.0.1 原有的未签名二进制附件已经撤回。正式签名证书准备完成前，MEOW Release 将仅提供源代码。

            ---

            MEOW 0.0.2 is currently distributed as source code only. Official prebuilt binaries are not provided.

            GitHub automatically provides `Source code (zip)` and `Source code (tar.gz)`. Follow `BUILDING.md` in the repository to build locally:

            - macOS: creates and opens a DMG; installation remains the user's choice
            - Windows: creates an NSIS installer and opens its setup wizard; the user may continue or cancel
            - locally built installers are not officially signed by MEOW; only build and run trusted source

            The unsigned binary assets previously attached to 0.0.1 have been withdrawn. MEOW releases will remain source-only until official signing credentials are available.
          generate_release_notes: true
          draft: false
          prerelease: false
